<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Primera Página Web</title>
    <style>
        /* Estilos básicos para que se vea ordenada */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        header {
            background-color: #007BFF;
            color: white;
            padding: 20px;
            border-radius: 8px;
        }
        main {
            margin-top: 20px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <header>
        <h1>¡Hola, mundo!</h1>
        <p>Esta es mi primera página web súper básica.</p>
    </header>

    <main>
        <h2>¿Qué contiene este ejemplo?</h2>
        <p>Una estructura HTML sencilla combinada con un poco de diseño (CSS) dentro de la misma etiqueta <code>&lt;style&gt;</code>.</p>
        <button onclick="alert('¡Gracias por hacer clic!')">Haz clic aquí</button>
    </main>

</body>
</html>
